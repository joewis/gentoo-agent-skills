# GPG config for Gentoo binhost binary package verification
# Place at /etc/portage/gnupg/gpg.conf
#
# no-random-seed-file is needed because Portage may run GPG as
# the nobody user which can't write to the keyring directory.
# Verification is read-only so this is safe.

no-random-seed-file
keyid-format 0xLONG
with-fingerprint